[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-erp-inventory"
version = "1.0.0"
description = "A small inventory ledger for purchases, sales, and stock checks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
erp-stock = "erp_inventory.cli:main"

[tool.setuptools.packages.find]
include = ["erp_inventory*"]
